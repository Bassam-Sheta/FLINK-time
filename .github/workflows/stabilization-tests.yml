name: Stabilization Tests

on:
  pull_request:
  push:
    branches:
      - work/steps-16-20-20260928

concurrency:
  group: stabilization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run regression tests
        run: npm test
